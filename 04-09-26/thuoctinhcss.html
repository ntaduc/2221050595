<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .khoi-1 {
            background-color: red;

        }

        .khoi-2 {
            background-color: green;
            /* margin la khoang cach giua cac block */
            margin: 100px;
            /* nếu có 2 gtri thì gtri đầu là margin top-bottom, gtri sau là margin left-right */
            /* nếu có 3 giá trị thì gtri đầu là margin top, gtri thứ hai là margin right-left, gtri thứ ba là margin bottom */
            /* nếu có 4 giá trị thì lần lượt là margin top, margin right, margin bottom, margin left */
            margin: 10px 20px 30px 40px;
            /* padding la khoang cach giua noi dung va canh cua block */
            
            padding:20px;
    
        }

        .khoi-3 {
            background-color: yellow;

        }
    </style>
</head>
<body>
    <div class="khoi-1">Block 1</div>
    <div class="khoi-2">Block 2</div>
    <div class="khoi-3">Block 3</div>
</body>
</html>
